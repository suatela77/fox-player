<style>
/* Conceito: painel de comissão técnica à noite, verde de gramado e amarelo de placar */
:root{--bg:#0d1411;--panel:#15201a;--panel2:#1d2b23;--line:#2b3d33;--fg:#eef3ee;--muted:#93a79a;--accent:#f4c430;--accent-ink:#1a1500;--pitch:#1c6b44;--good:#4cc38a;--bad:#ef6b5b;--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}

.sub{color:var(--muted);margin:0 0 18px}.fine{color:var(--muted);font-size:12.5px;margin-top:22px}
.logo{font:700 64px/.92 var(--disp);letter-spacing:1px;margin:26px 0 8px}.logo em{font-style:normal;color:var(--accent)}
.bdg{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid;font-family:var(--disp);font-weight:700;flex:none;letter-spacing:.3px}
.hd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;border-left:6px solid var(--c1)}
.club{font:700 26px/1.05 var(--disp)}.club span{color:var(--accent)}
.mgr{color:var(--muted);font-size:13px}

.hd-r{text-align:right;min-width:150px}.date{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:5px;background:#0a100d;overflow:hidden;margin:2px 0 6px}.bar i{display:block;height:100%;background:var(--good)}
.lbl{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.cash{font:700 20px var(--disp);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0a100d;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;background:none;border:0;padding:13px 2px;color:var(--muted);font:600 14px var(--disp);letter-spacing:.5px;text-transform:uppercase;border-top:3px solid transparent}
.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px}
select,input[type=text],input[type=number],textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
textarea{width:100%;min-height:150px;font:12px/1.4 monospace}
.pr{display:grid;grid-template-columns:44px 1fr 44px 34px;gap:8px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line)}
.pr.st{background:linear-gradient(90deg,#1c3a2a,transparent 70%)}
.pr small{display:block;color:var(--muted);font-size:12px}
.pos{font:700 14px var(--disp);text-align:center;border-radius:6px;padding:3px 0;background:var(--panel2);border:1px solid var(--line)}
.p-G{color:#d8dde0}.p-ZAG,.p-LD,.p-LE{color:#8ec5ff}.p-VOL,.p-MEI{color:#9de3b4}.p-ATA{color:#ffb4a6}
.en{height:6px;background:#0a100d;border-radius:4px;overflow:hidden}.en i{display:block;height:100%;background:var(--good)}
.rt{font:700 22px var(--disp);text-align:right}
.pitch{position:relative;aspect-ratio:3/3.6;border-radius:12px;border:2px solid #e9f1ea55;background:repeating-linear-gradient(180deg,#1c6b44 0 12.5%,#1a6140 12.5% 25%);overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #e9f1ea44}

.sl{position:absolute;transform:translate(-50%,-50%);width:16%;min-width:54px;max-width:78px;background:#0d1411e6;border:2px solid var(--line);border-radius:9px;padding:3px 2px;text-align:center;z-index:1}
.sl.sel{border-color:var(--accent);box-shadow:0 0 0 2px #f4c43055}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;font:700 15px var(--disp);letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.mt{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mt:last-child{border:0}.mt .h{text-align:right}.mt .sc{font:700 18px var(--disp);min-width:54px;text-align:center}
.mt.me{background:#f4c4301c;border-radius:6px}

td.n{text-align:left}th.n{text-align:left}tr.me td{background:#f4c4301c}
tr.z1 td:first-child{box-shadow:inset 3px 0 var(--good)}tr.z2 td:first-child{box-shadow:inset 3px 0 #6cb7ff}tr.z3 td:first-child{box-shadow:inset 3px 0 var(--bad)}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px))}
.score{font:700 44px/1 var(--disp);text-align:center;margin:6px 0}
.ev{padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.ccard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.ccard b{font:700 20px var(--disp)}.ccard small{display:block;color:var(--muted)}
.ed{display:grid;grid-template-columns:1fr 78px 58px;gap:6px;margin:5px 0}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30}
.clock{font:700 36px/1 var(--disp);text-align:center;color:var(--accent);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.mp{position:relative;aspect-ratio:3/3.1;border-radius:12px;border:2px solid #e9f1ea55;background:repeating-linear-gradient(180deg,#1c6b44 0 12.5%,#1a6140 12.5% 25%);overflow:hidden;margin:6px 0}
.mp:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #e9f1ea44}
.mp:after{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;border:2px solid #e9f1ea44;border-radius:50%;transform:translate(-50%,-50%)}
.dt{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid;font:700 12px/20px var(--disp);text-align:center;transform:translate(-50%,-50%);transition:left .45s ease,top .45s ease;z-index:1}
.ball{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #0007;transform:translate(-50%,-50%);transition:left .3s ease,top .3s ease;z-index:2}
.ev.goal{color:var(--accent);font-weight:600}.ev.chance{color:var(--fg)}.ev.sys,.ev.info{color:var(--muted)}
.pos2{color:var(--good)}.neg{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.btn,.sl{transition:transform .08s}.btn:active{transform:scale(.98)}}

/* visual v3 */

.cd{display:inline-block;width:.55em;height:.78em;border-radius:3px;margin-right:.3em;vertical-align:-.08em;box-shadow:0 0 0 2px #0006;transform:rotate(-8deg)}.cd.y{background:#ffd400}.cd.r{background:#e3342f}

/* v6: camisa e fonte menor */

#mp{width:min(100%,calc((100vh - 330px)*.847));width:min(100%,calc((100dvh - 330px)*.847));margin:0 auto}

.bn{position:relative}

 for(const p of ORD)for(let i=0;i<NSQ[p];i++){let n;do{n=FN[Math.floor(r()*FN.length)][0]+'. '+LN[Math.floor(r()*LN.length)]}while(used.has(n));used.add(n);
  const rt=clamp(Math.round(c[4]+5-i*3.5+(r()*6-3)),30,92),v=val(rt);
  pl.push({n,p,r:rt,a:18+Math.floor(r()*17),e:100,v,s:sal(v),g:0})}
 if(R&&R.full){pl.length=0;R.full.forEach(([n,ps,rt])=>{const v=val(rt);pl.push({n,p:ps,r:rt,a:19+Math.floor(r()*16),e:100,v,s:sal(v),g:0})})}
 else if(R&&R.xi){const k={};R.xi.forEach(([n,ps,rt])=>{const idx=pl.filter(q=>q.p===ps),j=k[ps]=(k[ps]||0),t=idx[j];k[ps]++;if(!t)return;const nr=rt>=0?rt:clamp(Math.round(c[4]+4-j*2+(r()*4-2)),40,90);t.n=n;t.r=nr;t.v=val(nr);t.s=sal(t.v)})}
 pl.forEach(q=>{q.r0=q.r;if(q.r>=83){q.c=1;q.v=valP(q);q.s=sal(q.v)}});
 return{name:c[0],short:c[1],c1:c[2],c2:c[3],str:c[4],cash:Math.round((c[4]-40)*0.9)*1e6,form:'4-4-2',pl}})}

const SK={G:['Reflexos/Posicionamento','Reflexos/Saída de bola','Posicionamento/Pênaltis'],ZAG:['Desarme/Marcação','Desarme/Cabeceio','Marcação/Resistência'],LD:['Cruzamento/Velocidade','Resistência/Cruzamento','Marcação/Apoio'],LE:['Cruzamento/Velocidade','Resistência/Cruzamento','Marcação/Apoio'],VOL:['Desarme/Passe','Marcação/Resistência','Desarme/Resistência'],MEI:['Passe/Finalização','Armação/Passe','Dribles/Passe'],ATA:['Finalização/Cabeceio','Velocidade/Dribles','Finalização/Frieza']};
const AT=['fin','dri','tec','vel','for','res','cab','des'],AN={tec:'Técnica',dri:'Drible',fin:'Finalização',for:'Força',res:'Resistência',vel:'Velocidade',cab:'Cabeceio',des:'Desarme'};
const APOS={ATA:{tec:4,dri:8,fin:15,for:0,res:-4,vel:6,cab:5,des:-30},MEI:{tec:10,dri:6,fin:2,for:-6,res:6,vel:0,cab:-12,des:-15},VOL:{tec:-6,dri:-10,fin:-18,for:8,res:8,vel:-2,cab:4,des:12},ZAG:{tec:-14,dri:-20,fin:-28,for:12,res:4,vel:-6,cab:12,des:14},LD:{tec:-10,dri:-6,fin:-22,for:0,res:10,vel:12,cab:-10,des:6},LE:{tec:-10,dri:-6,fin:-22,for:0,res:10,vel:12,cab:-10,des:6},G:{tec:-10,dri:-40,fin:-40,for:6,res:0,vel:-8,cab:-20,des:-35}};
function attrs(p){let h=0;for(const ch of p.n)h=(h*31+ch.charCodeAt(0))>>>0;const r=rng(h),o={},ap=APOS[p.p]||APOS.MEI;AT.forEach(k=>{o[k]=clamp(Math.round(p.r*.8+ap[k]*.7+8+(r()*12-6)),12,88)});return o}
const virt=p=>{const a=attrs(p);return AT.map(k=>[k,a[k]]).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([k,v])=>AN[k]+' '+v).join(' · ')};

 if(G.lst.length<5&&Math.random()<.45){const ks=G.clubs.map((c,k)=>k).filter(k=>k!==G.me&&G.clubs[k].pl.length>19);if(!ks.length)return;

function ltAlertGo(k,now){const lo=S.lo;if(!lo)return;lo.kind=k;lo.step='offer';if(now)ltBid(100);else render(true)}
function ltOpen(id){const l=(G.lst||[]).find(x=>x.id===id);if(!l)return;S.lo={id,kind:l.mode==='venda'?'buy':l.mode==='emp'?'loan':null,step:'offer'};S.bk=24;render(true)}
function ltClose(){S.lo=null;render(true)}
function ltKind(k){S.lo.kind=k;render(true)}
function ltBase(l,k){return k==='loan'?l.loan:l.ask}
function ltBid(pct){const lo=S.lo,l=G.lst.find(x=>x.id===lo.id);if(!l)return ltClose();const base=ltBase(l,lo.kind);lo.mine=Math.round(base*pct/100);
 const others=G.clubs.map((c,k)=>k).filter(k=>k!==G.me&&k!==l.ci).sort(()=>Math.random()-.5).slice(0,2);
 lo.riv=others.filter(()=>Math.random()<(lo.kind==='buy'?.4:.3)).map(k=>({ci:k,cap:base*(1.05+Math.random()*.3),bid:Math.round(base*(.95+Math.random()*.2))}));
 ltResolve(l)}
function ltTop(lo){return lo.riv.reduce((m,r)=>Math.max(m,r.bid),0)}
function ltResolve(l){const lo=S.lo,base=ltBase(l,lo.kind);
 if(!lo.riv.length){if(lo.mine>=base*l.res)return ltWin(l);lo.step='offer';render(true);return toast(G.clubs[l.ci].short+' recusou a oferta: valor baixo demais.')}
 if(lo.mine>ltTop(lo)&&lo.mine>=base*l.res)return ltWin(l);
 lo.step='dispute';render(true)}
function ltRaise(f){const lo=S.lo,l=G.lst.find(x=>x.id===lo.id);if(!l)return ltClose();
 lo.mine=Math.round(Math.max(lo.mine,ltTop(lo))*f);
 lo.riv=lo.riv.filter(r=>r.cap>lo.mine&&Math.random()<.6).map(r=>({...r,bid:Math.min(Math.round(r.cap),Math.round(lo.mine*(1.03+Math.random()*.07)))}));
 ltResolve(l)}
function ltQuit(){const lo=S.lo,l=G.lst.find(x=>x.id===lo.id);if(l&&lo.riv&&lo.riv.length){const w=lo.riv.reduce((a,b)=>b.bid>a.bid?b:a),f=ltFind(l);if(f){const W=G.clubs[w.ci],p=removePlayer(l.ci,f.i);if(lo.kind==='buy')W.pl.push(p);else G.clubs[l.ci].pl.push(p);
  toast(lo.kind==='buy'?p.n+' foi contratado pelo '+W.short+'.':p.n+' foi emprestado ao '+W.short+'.')}
  if(lo.kind==='buy')G.lst=G.lst.filter(x=>x.id!==l.id)}
 S.lo=null;render(true)}
function ltWin(l){const lo=S.lo,f=ltFind(l);if(!f){S.lo=null;return render(true)}const price=lo.mine;
 if(G.cash<price){lo.step='offer';render(true);return toast('Caixa insuficiente para esse valor.')}
 if(me().pl.length>=30){lo.step='offer';render(true);return toast('Elenco cheio (máximo 30). Venda ou empreste alguém antes.')}
 if(f.c.pl.length<=18){S.lo=null;render(true);return toast('O clube não vende: elenco no limite.')}
 const pl=removePlayer(l.ci,f.i);G.cash-=price;ensureFin();
 if(lo.kind==='buy'){ctSign(pl,S.bk||24);G.lst=G.lst.filter(x=>x.id!==l.id);G.fin.unshift({r:G.round,txt:'Compra de '+pl.n,d:-price});toast('Contratado: '+pl.n+' por '+fm(price))}
 else{pl.lnIn=l.ci;pl.k=Math.max(pl.k||12,12);G.fin.unshift({r:G.round,txt:'Empréstimo de '+pl.n,d:-price});toast(pl.n+' chega por empréstimo até o fim da temporada ('+fm(price)+')')}
 G.fin=G.fin.slice(0,12);me().pl.push(pl);S.lo=null;autoSave();render(true)}
function loansIn(){const c=me();for(let i=c.pl.length-1;i>=0;i--){const p=c.pl[i];if(p.lnIn!=null){const pl=removePlayer(G.me,i),b=G.clubs[pl.lnIn];delete pl.lnIn;if(b)b.pl.push(pl)}}}
function lstV(){G.lst=G.lst||[];const rows=G.lst.map(l=>{const f=ltFind(l);if(!f)return'';const p=f.c.pl[f.i];return`<div class="pr" onclick="ltOpen('${l.id}')" style="grid-template-columns:50px 1fr auto;cursor:pointer"><span class="pos p-${p.p}">${p.p}${sdH(p)}</span><div><b>${esc(p.n)}</b><small>${esc(f.c.short)} · ${p.a} anos · força ${p.r}</small><small style="color:#f4c430">${ltMode(l)}</small></div><button class="btn">${fm(l.mode==='emp'?l.loan:l.ask)}</button></div>`}).join('');
 return`<p class="lbl" style="display:block;margin:8px 0">Jogadores que outros clubes colocaram à venda ou para empréstimo. Toque para fazer uma oferta. Novos aparecem durante as rodadas.</p>`+(rows||'<p class="lbl" style="display:block;font-size:15px;margin:20px 0">Nenhum jogador na vitrine agora. Jogue algumas rodadas.</p>')}
function ltDlg(){const lo=S.lo;if(!lo)return'';const l=(G.lst||[]).find(x=>x.id===lo.id),f=l&&ltFind(l);if(!f){S.lo=null;return''}const p=f.c.pl[f.i];
 const head=`<h3 style="margin:0 0 6px;font-size:22px">${esc(p.n)}</h3><p style="margin:0 0 4px;font-size:16px;opacity:.85">${p.p} · ${p.a} anos · força ${p.r} · ${esc(f.c.name)}</p>`;
 const btn=(t,fn,pri)=>`<button class="btn${pri?' pri':''}" style="width:100%;margin:6px 0;padding:14px;font-size:16px!important" onclick="${fn}">${t}</button>`;
 let body;
 if(lo.step==='alert'){const vd=l.mode!=='emp',em=l.mode!=='venda';body=`<h3 style="margin:0 0 6px;font-size:20px">📢 Jogador no mercado</h3><p style="margin:0 0 8px;font-size:15px;opacity:.9">O <b>${esc(f.c.name)}</b> colocou <b>${esc(p.n)}</b> ${vd&&em?'à venda ou para empréstimo':vd?'à venda':'para empréstimo'}.</p><p style="margin:0 0 4px;font-size:16px;opacity:.85">${p.p} · ${p.a} anos · força ${p.r}</p>`+(vd?`<p style="margin:6px 0 0;font-size:17px">💰 Preço pedido: <b>${fm(l.ask)}</b></p>`:'')+(em?`<p style="margin:4px 0 0;font-size:17px">🤝 Empréstimo até o fim da temporada: <b>${fm(l.loan)}</b></p>`:'')+`<p style="margin:12px 0 6px;font-size:16px"><b>Quer fazer uma proposta ou comprar?</b></p>`+(vd?btn('Comprar agora · '+fm(l.ask),"ltAlertGo('buy',1)",1):'')+(em?btn('Pegar emprestado · '+fm(l.loan),"ltAlertGo('loan',1)",!vd):'')+btn('Fazer proposta',"ltAlertGo("+(vd&&em?'null':vd?"'buy'":"'loan'")+",0)")+btn('Agora não','ltClose()')}
 else if(!lo.kind)body=head+`<p style="margin:10px 0">O clube aceita as duas opções:</p>`+btn('Comprar · pedem '+fm(l.ask),"ltKind('buy')")+btn('Pegar emprestado · '+fm(l.loan),"ltKind('loan')")+btn('Fechar','ltClose()');
 else if(lo.step==='dispute'){const top=ltTop(lo);body=head+`<p style="margin:10px 0;font-size:18px;color:#f4c430"><b>Disputa!</b></p><p style="margin:0 0 4px">Sua oferta: <b>${fm(lo.mine)}</b></p>`+lo.riv.map(r=>`<p style="margin:0 0 4px">${esc(G.clubs[r.ci].name)}: <b>${fm(r.bid)}</b></p>`).join('')+`<div style="height:10px"></div>`+btn('Cobrir: '+fm(Math.round(top*1.05)),'ltRaise(1.05)',1)+btn('Subir forte: '+fm(Math.round(top*1.15)),'ltRaise(1.15)')+btn('Desistir','ltQuit()')}
 else{const base=ltBase(l,lo.kind);body=head+`<p style="margin:6px 0 10px;font-size:15px;opacity:.85">${lo.kind==='buy'?'Compra · pedem '+fm(l.ask):'Empréstimo até o fim da temporada · pedem '+fm(l.loan)}</p>`

  +`<p style="margin:6px 0">Sua oferta:</p>`+[85,95,100,110,125].map(x=>btn(fm(Math.round(base*x/100))+(x===100?' (preço pedido)':''),'ltBid('+x+')',x===100)).join('')+btn('Fechar','ltClose()')}
 return`<div class="ovl" onclick="ltClose()"><div class="dlg" onclick="event.stopPropagation()" style="padding:20px;max-height:92vh;overflow:auto">${body}</div></div>`}
/* ===== contratos ===== */
const CTM={6:1.10,12:1.05,24:1,36:.97,48:.95,60:.93};
const ctRnd=p=>{const y=p.a>=33?[6,12,12,18,24]:p.a>=29?[12,24,24,36]:[12,24,36,48,60];return Math.max(6,y[Math.floor(Math.random()*y.length)]-Math.floor(Math.random()*6))};
function ensureCt(){if(!G||!G.clubs)return;applySides(G.clubs);G.clubs.forEach(c=>c.pl.forEach(p=>{if(p.k==null)p.k=ctRnd(p)}))}
const ctTxt=k=>k<=0?'vencido':k<12?Math.max(1,Math.ceil(k))+(Math.ceil(k)>1?' meses':' mês'):Math.floor(k/12)+(Math.floor(k/12)>1?' anos':' ano')+(Math.round(k%12)?' e '+Math.round(k%12)+'m':'');
const ctSal=(p,m)=>Math.max(20,Math.round(p.s*(CTM[m]||1)));
function ctTick(){ensureCt();const st=12/38,warn=[],gone=[];
 G.clubs.forEach((c,ci)=>{for(let i=c.pl.length-1;i>=0;i--){const p=c.pl[i],was=p.k;p.k-=st;
  if(ci!==G.me){if(p.k<=0)p.k=12*(1+Math.floor(Math.random()*4));continue}
  if(p.lnIn!=null){p.k=Math.max(p.k,12);continue}
  if(p.k<=0){if(c.pl.length<=16){p.k=6;warn.push(p.n+' (renovado por 6 meses, elenco mínimo)')}else{const pl=removePlayer(ci,i);delete pl.k;pl.sale=false;G.pool=G.pool||[];G.pool.push(pl);gone.push(pl.n)}}
  else if(was>6&&p.k<=6)warn.push(p.n)}});
 if(gone.length)setTimeout(()=>toast('Contrato terminou e saíram: '+gone.join(', ')),1500);
 if(warn.length)setTimeout(()=>toast('Contrato acabando (6 meses): '+warn.join(', ')),3500)}
function ctSign(p,m){p.k=m;p.s=ctSal(p,m)}
function renewOv(i){const p=me().pl[i];
 S.ov=`<h2 style="margin-top:0">Renovar ${esc(p.n)}</h2><p class="lbl" style="display:block">Contrato atual: ${ctTxt(p.k)} · Salário: ${p.s}k/mês</p>`+[6,12,24,36,48,60].map(m=>`<button class="btn" style="width:100%;margin:6px 0;padding:14px;font-size:16px!important;text-align:left" onclick="renewP(${i},${m})">${m<12?m+' meses':(m/12)+(m>12?' anos':' ano')} · salário ${ctSal(p,m)}k/mês</button>`).join('')+`<button class="btn big" onclick="playerOv(${i})">Voltar</button>`;render(true)}
function renewP(i,m){const p=me().pl[i];if(p.rf===G.round){S.ov=null;render(true);return toast(p.n+' não quer conversar agora. Tente na próxima rodada.')}

const ffR=(px)=>`<img src="${FF_ROSTO}" alt="" style="width:${px}px;height:${px}px;border-radius:50%;vertical-align:middle">`;
const FF_API='https://lxflyweiijbqdmandbcs.supabase.co/functions/v1/footfox';
const FF_EMAIL='footfox.suporte@gmail.com';
const FF_PRECO='6,90';
function ffCode(){let c='';try{if(window.FFApp&&FFApp.codigo)c=FFApp.codigo()}catch(e){}
 if(!c){try{c=localStorage.getItem('ff_cod')||''}catch(e){}if(!c){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<10;i++)c+=A[Math.floor(Math.random()*32)];try{localStorage.setItem('ff_cod',c)}catch(e){}}}
 return c}
const ffShow=c=>c.slice(0,5)+'-'+c.slice(5);
function prem(){if(FF_LOJA==='play')return true;try{return localStorage.getItem('ff_prem')===ffCode()}catch(e){return false}}
async function ffApi(q){const r=await fetch(FF_API+'?'+new URLSearchParams(q),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.erro||'Sem conexão com o servidor. Tente de novo.');return d}
async function ffCheck(silent){if(FF_LOJA==='play')return true;try{const d=await ffApi({acao:'status',codigo:ffCode()});if(d.premium){const was=prem();try{localStorage.setItem('ff_prem',ffCode())}catch(e){}if(!was){S.ov=premOkOv();render()}return true}if(!silent)toast('Pagamento ainda não confirmado. Se já pagou, aguarde 1 minuto e toque de novo.');return false}catch(e){if(!silent)toast(e.message);return false}}
function premOkOv(){return`<h2 style="margin-top:0">${ffR(34)} Premium liberado!</h2><p>Obrigado por apoiar o FootFox 26. Agora você tem temporadas sem limite, o editor de times e jogadores e a troca de clube.</p><button class="btn pri big" onclick="closeOv()">Continuar</button>`}
const PREM_WHY={temporada:'A primeira temporada é grátis. Para continuar a sua carreira com este time, libere o Premium.',editor:'O editor de times e jogadores faz parte do Premium.',clube:'Trocar de clube faz parte do Premium.',menu:''};
function premOv(why){if(prem()){S.ov=premOkOv();return render()}
 S.ov=`<h2 style="margin-top:0">${ffR(34)} FootFox Premium</h2>${PREM_WHY[why]?`<p style="color:#f4c430"><b>${PREM_WHY[why]}</b></p>`:''}
 <p style="margin:6px 0">✔ Temporadas sem limite, continuando a carreira<br>✔ Editor de times e jogadores<br>✔ Aceitar convites de outros clubes</p>
 <p style="font:700 26px var(--disp);margin:8px 0;color:var(--accent)">R$ ${FF_PRECO} <span class="lbl" style="font:500 14px var(--body,inherit)">pagamento único, para sempre</span></p>
 <label class="lbl" for="ffcup">Tem cupom? (opcional)</label><input type="text" id="ffcup" autocomplete="off" style="width:100%;margin:3px 0 10px;text-transform:uppercase" placeholder="Ex.: FOX20">
 <button class="btn pri big" onclick="ffPix(this)">Pagar com Pix</button>
 <button class="btn big" onclick="ffBuy(this)">Pagar com cartão (Mercado Pago)</button>
 <button class="btn big" onclick="ffCheck(false)">Já paguei: liberar agora</button>
 <p class="lbl" style="display:block;margin:8px 0 0">Código deste aparelho: <b style="font-size:16px;letter-spacing:1px">${ffShow(ffCode())}</b></p>
 ${FF_EMAIL?`<button class="btn big" onclick="ffMail()">Fale conosco por e-mail</button>`:''}
 <button class="btn big" onclick="closeOv()">Agora não</button>`;render()}
async function ffBuy(b){const cup=(($('#ffcup')||{}).value||'').trim().toUpperCase();b.disabled=true;b.textContent='Abrindo o Mercado Pago…';
 try{const d=await ffApi({acao:'comprar',codigo:ffCode(),cupom:cup});if(d.premium){await ffCheck(true);if(!S.ov||!/liberado/.test(S.ov)){S.ov=premOkOv();render()}return}
  if(!d.link)throw Error('Não foi possível abrir o pagamento.');if(d.preco)toast('Valor: R$ '+Number(d.preco).toFixed(2).replace('.',','));if(window.FFApp)location.href=d.link;else{const w=window.open(d.link,'_blank');if(!w)location.href=d.link}}
 catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='Pagar com cartão (Mercado Pago)'}}
let FFPIX=null,FFPT=null;
function ffCup(){return(($('#ffcup')||{}).value||'').trim().toUpperCase()}
async function ffPix(b){const cup=ffCup();b.disabled=true;b.textContent='Gerando o Pix…';
 try{const d=await ffApi({acao:'pix',codigo:ffCode(),cupom:cup});if(d.premium){await ffCheck(true);if(!S.ov||!/liberado/.test(S.ov)){S.ov=premOkOv();render()}return}
  if(!d.copia)throw Error('Não foi possível gerar o Pix.');FFPIX=d;ffPixOv();ffPoll()}
 catch(e){toast(e.message);b.disabled=false;b.textContent='Pagar com Pix'}}
function ffPixOv(){const d=FFPIX;S.ov=`<h2 style="margin-top:0">${ffR(34)} Pagar com Pix</h2>
 <p style="margin:4px 0">Valor: <b style="color:var(--accent)">R$ ${Number(d.preco).toFixed(2).replace('.',',')}</b> · FootFox 26 Premium</p>
 ${d.qr?`<div style="text-align:center;margin:8px 0"><img src="data:image/png;base64,${d.qr}" alt="QR Code do Pix" style="width:210px;height:210px;background:#fff;padding:8px;border-radius:12px"></div>`:''}
 <p class="lbl" style="display:block;margin:6px 0">Pix copia e cola:</p>
 <textarea id="ffcc" readonly style="width:100%;height:74px;font-size:12px;word-break:break-all">${esc(d.copia)}</textarea>
 <button class="btn pri big" onclick="ffCopy()">Copiar código Pix</button>
 <p style="margin:8px 0">Abra o app do seu banco, escolha <b>Pix copia e cola</b>, cole o código e pague. Depois volte aqui: o Premium libera sozinho em alguns segundos.</p>
 <button class="btn big" onclick="ffCheckPix(true)">Já paguei: liberar agora</button>
